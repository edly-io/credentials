{% load i18n %}
<div class="wrapper-header" dir="rtl" style="direction:rtl;">
  <header class="header-app" role="banner" style="display:flex; align-items:center; justify-content:center; padding:12px 24px; background:#fff; border-bottom:1px solid #e5e7eb;">
    <h1 class="header-app-title" style="margin:0;">
      <a class="logo" href="{{ site.siteconfiguration.lms_url_root }}">
        <img class="logo-img" src="{{ site_logo_url }}" style="height:48px; width:auto;" alt="{{ site.name }}">
      </a>
    </h1>
  </header>
</div>
